<nav class="footerNav"><button onclick="showList()">▦<br>圖鑑</button><button onclick="openTasks()">☷<br>任務一覽</button><button onclick="openAddTarget()">＋<br>新增目標</button><button onclick="openSettings()">⚙<br>設定</button></nav>
<div id="targetModal" class="modal"><div class="modalBox"><h2>建立新目標</h2><div class="formGrid"><input id="targetName" placeholder="目標名稱，例如：通過行政法考試"><input id="targetIcon" placeholder="圖示，例如：📖" value="✦"></div><div class="modalActions"><button class="ghost" onclick="closeModal()">取消</button><button class="action primary" onclick="createTarget()">建立</button></div></div></div>
<div id="settingsModal" class="modal"><div class="modalBox"><h2>設定</h2><div id="accountStatus" class="accountStatus">尚未登入；目前使用本機資料。</div><div class="formGrid" style="margin-top:12px"><input id="loginEmail" type="email" autocomplete="username" placeholder="登入 Email"><input id="loginPassword" type="password" autocomplete="current-password" placeholder="登入密碼"><div class="modalActions"><button class="action primary" onclick="loginAccount()">登入</button><button class="ghost" onclick="logoutAccount()">登出</button></div></div><button class="ghost" style="margin-top:10px" onclick="toggleFirebaseConfig()">Firebase 專案設定</button><div id="firebaseConfig" class="accountConfig"><div class="accountHint">第一次使用時請填入 Firebase Web App 設定。本版本只有登入，不提供註冊功能。</div><input id="fbApiKey" placeholder="apiKey"><input id="fbAuthDomain" placeholder="authDomain"><input id="fbProjectId" placeholder="projectId"><input id="fbAppId" placeholder="appId"><button class="action" onclick="saveFirebaseConfig()">儲存 Firebase 設定</button></div><div class="accountHint" style="margin-top:10px">登入只負責帳號驗證；目標資料目前仍保存在本機。</div><div class="recycleBox"><h3>回收目標</h3><div class="accountHint">選擇不需要的目標並永久刪除；刪除前建議先匯出資料備份。</div><div class="recycleRow"><select id="recycleTargetSelect"></select><button class="action danger" onclick="recycleTarget()">回收</button></div></div><div class="modalActions"><button class="ghost" onclick="closeModal()">關閉</button><button class="action" onclick="exportData()">匯出資料</button><button class="action" onclick="document.getElementById('importFile').click()">匯入資料</button><input id="importFile" type="file" accept=".json" hidden onchange="importData(event)"></div></div></div>
<script>
const KEY="personal-upgrade-v1";
// 碧藍航線「彩皮／決戰方案」升級表：陣列第 0 格代表 Lv.1 -> Lv.2。
const SHIP_EXP=[120,240,360,480,600,720,840,960,1080,1200,1320,1440,1560,1680,1800,1920,2040,2160,2280,2400,2520,2640,2760,2880,3000,3120,3240,3360,3480,3600,3720,3840,3960,4080,4200,4320,4440,4560,4680,4800,5040,5280,5520,5760,6000,6240,6480,6720,6960,7200,7440,7680,7920,8160,8400,8640,8880,9120,9360,9600,9960,10320,10680,11040,11400,11760,12120,12480,12840,13200,13680,14160,14640,15120,15600,16080,16560,17040,17520,18000,18600,19200,19800,20400,21000,21600,22200,22800,23400,26000,27300,28600,31200,33800,39000,45500,52000,78000,171600,60000,63600,67200,70800,74400,78000,85200,92400,99600,106800,114000,126000,138000,150000,162000,174000,192000,210000,228000,246000,264000,289200,314400,339600,364800];
let targets=[],activeId=null;
const NIPPON_COLORS=[["刈安","#e9cd4c"],["撫子","#dc9fb6"],["紅梅","#d05a6e"],["蘇芳","#9e3d3f"],["桜","#fef4f4"],["琥珀","#ca6924"],["山吹","#f8b500"],["萌黄","#aacf53"],["常磐","#007b43"],["青磁","#78c2c4"],["浅葱","#48929b"],["瑠璃","#1e50a2"],["紺","#223a70"],["藤","#8b81c3"],["桔梗","#6a4c9c"],["銀鼠","#a6a5a5"],["鉛","#7b7c7d"],["墨","#27221f"],["黒","#141414"]];
function randomNipponColor(){return NIPPON_COLORS[Math.floor(Math.random()*NIPPON_COLORS.length)]}
function ensureTargetColor(t){if(!t.nipponColor){const c=randomNipponColor();t.nipponName=c[0];t.nipponColor=c[1];return true}return false}
function load(){try{targets=JSON.parse(localStorage.getItem(KEY)||"null")||seed.map((x,i)=>({...x,id:Date.now()+i,level:1,elite:0,exp:0,tasks:[]}));let changed=false;targets.forEach(t=>{if(ensureTargetColor(t))changed=true});if(changed)save()}catch(_){targets=[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(targets))}
function need(t){return t.level>=SHIP_EXP.length+1?0:SHIP_EXP[t.level-1]}
function gain(t,x){if(t.level>=SHIP_EXP.length+1)return;t.exp+=x;t.updated=Date.now();while(t.level<SHIP_EXP.length+1&&t.exp>=need(t)){t.exp-=need(t);t.level++}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const STAR_LEVELS=[1,10,30,70,100,125];
function renderStars(level){return STAR_LEVELS.map((needLevel,i)=>'<span class="star '+(level>=needLevel?'on':'')+'" title="Lv.'+needLevel+'">★</span>').join("")}
function renderCards(){const q=(document.getElementById("search").value||"").toLowerCase();let a=targets.filter(t=>t.name.toLowerCase().includes(q));const so=document.getElementById("sort").value;if(so==="name")a.sort((x,y)=>x.name.localeCompare(y.name));else if(so==="recent")a.sort((x,y)=>(y.updated||0)-(x.updated||0));else a.sort((x,y)=>(y.elite-x.elite)||(y.level-x.level));document.getElementById("cards").innerHTML=a.length?a.map(t=>{ensureTargetColor(t);const n=need(t),p=n?Math.min(100,t.exp/n*100):100;return '<article class="card '+(t.elite?'elite':'')+'" onclick="openTarget('+t.id+')"><span class="element">'+(t.element||"✦")+'</span><div class="cardTop" style="--nippon-color:'+t.nipponColor+'"></div><div class="cardName">'+esc(t.name)+'</div><div class="cardStars">'+renderStars(t.level)+'</div><div class="lv">Lv.'+t.level+'</div><div class="progress"><i style="width:'+p+'%"></i></div></article>'}).join(""):'<div class="empty">還沒有符合條件的目標，建立一個開始升級吧。</div>'}
const STAGES=[
["1-1",96,0,0,180],["1-2",120,132,0,204],["1-3",132,144,0,216],["1-4",156,168,180,252],
["2-1",180,198,216,270],["2-2",198,218,237,296],["2-3",216,237,259,321],["2-4",234,258,280,348],
["3-1",252,277,302,374],["3-2",270,297,323,400],["3-3",288,316,345,426],["3-4",306,337,367,452],
["4-1",323,356,388,478],["4-2",342,376,414,505],["4-3",360,396,432,530],["4-4",378,416,453,556],
["5-1",396,435,475,583],["5-2",414,456,496,609],["5-3",432,475,518,634],["5-4",450,495,540,661],
["6-1",468,514,561,687],["6-2",486,535,583,714],["6-3",504,554,604,739],["6-4",522,574,626,765],
["7-1",534,588,640,783],["7-2",546,601,655,800],["7-3",558,614,669,818],["7-4",570,627,684,835],
["8-1",552,607,662,808],["8-2",564,620,676,826],["8-3",576,633,691,843],["8-4",588,646,705,853],
["9-1",600,660,720,872],["9-2",612,673,734,890],["9-3",624,686,748,907],["9-4",636,699,763,924],
["10-1",648,712,777,948],["10-2",654,720,784,957],["10-3",666,732,799,974],["10-4",678,745,813,991],
["11-1",861,948,1034,1261],["11-2",870,956,1044,1272],["11-3",877,963,1052,1281],["11-4",883,973,1062,1293],
["12-1",900,990,1080,1315],["12-2",907,997,1088,1326],["12-3",914,1005,1098,1338],["12-4",921,1014,1106,1347],
["13-1",936,1029,1123,1369],["13-2",943,1036,1131,1380],["13-3",950,1045,1140,1390],["13-4",957,1053,1148,1401]
];
function fillStageOptions(){const e=document.getElementById("taskExp");if(!e||e.dataset.stages)return;STAGES.forEach(s=>{[["小型",s[1]],["中型",s[2]],["大型",s[3]]].forEach(x=>{if(x[1]){const o=document.createElement("option");o.value=x[1];o.textContent="關卡 "+s[0]+" "+x[0]+" · "+x[1]+" EXP";e.appendChild(o)}})});e.dataset.stages="1"}
function openTarget(id){activeId=id;document.getElementById("listView").style.display="none";document.getElementById("allTasksView").style.display="none";document.getElementById("detailView").style.display="block";renderDetail()}
function showList(){activeId=null;document.getElementById("detailView").style.display="none";document.getElementById("allTasksView").style.display="none";document.getElementById("listView").style.display="block";renderCards()}
function openTasks(){document.getElementById("listView").style.display="none";document.getElementById("detailView").style.display="none";document.getElementById("allTasksView").style.display="block";renderAllTasks()}
function renderAllTasks(){const root=document.getElementById("allTasks"),groups=targets.filter(t=>Array.isArray(t.tasks)&&t.tasks.length);if(!groups.length){root.innerHTML='<div class="empty">目前還沒有任務。先到目標裡新增任務吧。</div>';return}root.innerHTML=groups.map(t=>'<div class="allTaskGroup"><h3>'+esc(t.icon||"✦")+' '+esc(t.name)+' <span class="taskBadge">Lv.'+t.level+'</span></h3>'+t.tasks.map((x,i)=>'<div class="allTask '+(x.done?'done':'')+'" onclick="openTarget('+t.id+')"><div class="allTaskTitle">'+esc(x.title)+'<small>'+x.exp+' EXP · '+(x.done?'已完成':'待完成')+'</small></div><span>→</span></div>').join("")+'</div>').join("")}
function renderDetail(){const t=targets.find(x=>x.id===activeId);if(!t)return showList();const n=need(t),p=n?Math.min(100,t.exp/n*100):100;let tasks=t.tasks.length?t.tasks.map((x,i)=>{const repeat=x.type==="repeat",done=!repeat&&x.done,stage=repeat?STAGES[Math.min(x.stageIndex||0,STAGES.length-1)]:null,stageText=stage?" · 本次："+stage[0]+" 小型 · "+stage[1]+" EXP":(x.expLabel?" · 記憶："+x.expLabel:"");return '<div class="task '+(done?'done':'')+'"><div class="taskTitle">'+esc(x.title)+'<br><small>'+ (repeat?"循環性任務 · ":"一次性任務 · ")+(repeat?(stageText||"尚未開始"):"完成獲得 "+x.exp+" EXP"+stageText)+(repeat&&x.lastCompleted?" · 上次完成："+new Date(x.lastCompleted).toLocaleString():"")+'</small></div><button '+(done?'disabled':'')+' onclick="completeTask('+i+')">'+(done?'已完成':(repeat?'完成本輪':'完成任務'))+'</button><button class="ghost" onclick="deleteTask('+i+')">刪除</button></div>'}).join(""):'<div class="empty">這個目標還沒有任務。把大目標拆成今天可以完成的行動吧。</div>';document.getElementById("detail").innerHTML='<div class="detailHead"><div class="detailIcon" style="background:linear-gradient(145deg,'+(t.tone||"#6d8bc3")+',#75433d)">'+(t.icon||"✦")+'</div><div><h2>'+esc(t.name)+'</h2><div class="meta">'+(t.element||"✦")+'　Lv.'+t.level+'　'+(n?t.exp.toLocaleString()+" / "+n.toLocaleString()+" EXP":"已達 Lv.125 上限")+'</div><div class="xpbar"><i style="width:'+p+'%"></i></div></div><button class="ghost" onclick="deleteTarget()">刪除目標</button></div><div class="taskPanel"><h3>任務列表</h3><div class="note">循環性任務依序挑戰 1-1、1-2、1-3……；一次性任務可自由選擇基礎 EXP。只採用非 BOSS 艦隊經驗值。</div><div class="taskRow"><input id="taskName" placeholder="新增一個可執行任務"><select id="taskType"><option value="once">一次性任務</option><option value="repeat">循環性任務（從 1-1 開始）</option></select><select id="taskExp"><option value="100">自訂：簡單任務 · 100 EXP</option><option value="250">自訂：一般任務 · 250 EXP</option><option value="500">自訂：困難任務 · 500 EXP</option><option value="1000">自訂：里程碑 · 1000 EXP</option></select><button class="action primary" onclick="addTask()">新增</button></div>'+tasks+'</div>';fillStageOptions()}
function addTask(){const t=targets.find(x=>x.id===activeId),e=document.getElementById("taskName"),title=e.value.trim(),type=document.getElementById("taskType").value,expSelect=document.getElementById("taskExp");if(!title)return alert("請輸入任務內容");const firstStage=STAGES[0];t.tasks.push({title:title,type:type,exp:type==="repeat"?firstStage[1]:Number(expSelect.value),expLabel:type==="repeat"?"關卡 "+firstStage[0]+" 小型 · "+firstStage[1]+" EXP":expSelect.options[expSelect.selectedIndex].text,stageIndex:type==="repeat"?0:null,done:false,lastCompleted:null});t.updated=Date.now();save();e.value="";renderDetail()}
function completeTask(i){const t=targets.find(x=>x.id===activeId),x=t.tasks[i];if(!x||((x.type||"once")!=="repeat"&&x.done))return;if((x.type||"once")==="repeat"){const index=Math.min(x.stageIndex||0,STAGES.length-1),stage=STAGES[index];x.exp=stage[1];x.expLabel="關卡 "+stage[0]+" 小型 · "+stage[1]+" EXP";x.lastCompleted=Date.now();gain(t,x.exp);if(index<STAGES.length-1)x.stageIndex=index+1}else{x.done=true;gain(t,x.exp)}save();renderDetail()}
function deleteTask(i){const t=targets.find(x=>x.id===activeId);t.tasks.splice(i,1);save();renderDetail()}
function openAddTarget(){document.getElementById("targetModal").classList.add("show");setTimeout(()=>document.getElementById("targetName").focus(),30)}
function createTarget(){const n=document.getElementById("targetName").value.trim();if(!n)return alert("請輸入目標名稱");const c=randomNipponColor();targets.push({id:Date.now(),name:n,icon:document.getElementById("targetIcon").value.trim()||"✦",nipponName:c[0],nipponColor:c[1],element:"✦",level:1,elite:0,exp:0,tasks:[],updated:Date.now()});save();closeModal();renderCards()}
function deleteTarget(){if(!confirm("確定刪除這個目標與所有任務嗎？"))return;targets=targets.filter(x=>x.id!==activeId);save();showList()}
let fbAuth=null,fbUser=null;const FB_KEY="personal-upgrade-firebase";
function getFirebaseConfig(){try{return JSON.parse(localStorage.getItem(FB_KEY)||"null")}catch(_){return null}}
function fillFirebaseConfig(){const c=getFirebaseConfig()||{};["apiKey","authDomain","projectId","appId"].forEach(k=>{const e=document.getElementById("fb"+k.charAt(0).toUpperCase()+k.slice(1));if(e)e.value=c[k]||""})}
function toggleFirebaseConfig(){document.getElementById("firebaseConfig").classList.toggle("show")}
function saveFirebaseConfig(){const c={apiKey:fbApiKey.value.trim(),authDomain:fbAuthDomain.value.trim(),projectId:fbProjectId.value.trim(),appId:fbAppId.value.trim()};if(!c.apiKey||!c.authDomain||!c.projectId||!c.appId)return alert("請完整填寫 Firebase 設定。");localStorage.setItem(FB_KEY,JSON.stringify(c));location.reload()}
function initFirebase(){const c=getFirebaseConfig();fillFirebaseConfig();if(!c)return;try{firebase.initializeApp(c);fbAuth=firebase.auth();fbAuth.onAuthStateChanged(u=>{fbUser=u;updateAccountStatus()})}catch(e){console.error(e)}}
function updateAccountStatus(){const e=document.getElementById("accountStatus");if(!e)return;if(fbUser){e.textContent="已登入："+fbUser.email+"。";e.classList.add("ok")}else{e.textContent="尚未登入；目前使用本機資料。";e.classList.remove("ok")}}
async function loginAccount(){if(!fbAuth)return alert("請先在「Firebase 專案設定」完成設定。");const email=loginEmail.value.trim(),password=loginPassword.value;if(!email||!password)return alert("請輸入 Email 與密碼。");try{await fbAuth.signInWithEmailAndPassword(email,password)}catch(e){alert("登入失敗："+(e.message||e))}}
async function logoutAccount(){if(fbAuth)await fbAuth.signOut();updateAccountStatus()}
function renderRecycleTargets(){const e=document.getElementById("recycleTargetSelect");if(!e)return;e.innerHTML=targets.length?targets.map(t=>'<option value="'+t.id+'">'+esc(t.name)+' · Lv.'+t.level+'</option>').join(""):'<option value="">目前沒有目標</option>';e.disabled=!targets.length}
function recycleTarget(){const e=document.getElementById("recycleTargetSelect"),id=Number(e.value),t=targets.find(x=>x.id===id);if(!t)return;if(!confirm("確定要回收「"+t.name+"」嗎？\n\n這會永久刪除目標與底下所有任務。"))return;targets=targets.filter(x=>x.id!==id);save();renderRecycleTargets();renderCards();if(activeId===id)showList()}
function openSettings(){document.getElementById("settingsModal").classList.add("show");fillFirebaseConfig();updateAccountStatus();renderRecycleTargets()}function closeModal(){document.querySelectorAll(".modal").forEach(x=>x.classList.remove("show"))}
function exportData(){const b=new Blob([JSON.stringify({version:1,targets:targets},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="個人升級資料.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.targets))throw 0;targets=x.targets;save();closeModal();showList()}catch(_){alert("資料格式不正確")}};r.readAsText(f)}
load();renderCards();window.addEventListener("load",()=>{initFirebase();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js")});
</script></body></html>
